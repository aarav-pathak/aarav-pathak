name: Update GitHub Profile Stats & 3D Graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'profile-3d-contrib/**'
      - 'assets/stats.svg'
      - 'assets/competitive.svg'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: update-profile-assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Profile & Competitive Stats SVGs
        run: python3 scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/stats.svg assets/competitive.svg profile-3d-contrib/
          if git commit -m "chore(auto): update profile stats & 3d contrib [skip ci]"; then
            git push
          fi
