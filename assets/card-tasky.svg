<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 180" width="410" height="180" fill="none">
  <title>Tasky</title>
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e3b341" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e3b341" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e3b341" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="409" height="179" rx="12" fill="url(#cbg)" stroke="#21262d" stroke-width="1"/>
  
  <line x1="14" y1="1" x2="396" y2="1" stroke="url(#laser)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- badge -->
  <rect x="24" y="18" width="146" height="19" rx="9.5" fill="rgba(227,179,65,0.08)" stroke="rgba(227,179,65,0.28)" stroke-width="0.75"/>
  <text x="34" y="30" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#e3b341">PRODUCTIVITY · AUTH</text>
  <!-- title -->
  <text x="24" y="66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3" fill="#e6edf3">Tasky</text>
  <!-- desc -->
  <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#7d8590">
    <tspan x="24" y="90">Task tracking app with secure auth, priority filtering</tspan>
    <tspan x="24" dy="18">and persistent state across sessions.</tspan>
  </text>
  <!-- chips -->
  <g transform="translate(0, 146)">
    <rect x="24" y="0" width="59" height="22" rx="11" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.25)" stroke-width="1"/>
    <text x="53" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#79c0ff">React</text>
    <rect x="91" y="0" width="73" height="22" rx="11" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.25)" stroke-width="1"/>
    <text x="127" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#79c0ff">Node.js</text>
    <rect x="172" y="0" width="52" height="22" rx="11" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.25)" stroke-width="1"/>
    <text x="198" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#79c0ff">Auth</text>
  </g>
</svg>