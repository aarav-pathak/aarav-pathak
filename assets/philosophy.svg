<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 135" width="830" height="135" fill="none">
  <title>Engineering Philosophy</title>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="plaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d2a8ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulsePurple {
      0%,100% { opacity: 1; r: 3.5; }
      50% { opacity: 0.3; r: 5; }
    }
    .pulse-dot-p { animation: pulsePurple 2.6s ease-in-out infinite; transform-origin: 24px 22px; }
    .label-p {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px; font-weight: 600; letter-spacing: 1.8px; fill: #bc8cff;
    }
    .cell-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13.5px; font-weight: 600; fill: #e6edf3;
    }
    .cell-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11.5px; font-weight: 400; fill: #7d8590;
    }
  </style>

  <!-- Frame -->
  <rect x="0.5" y="0.5" width="829" height="134" rx="10" fill="url(#pbg)" stroke="#21262d" stroke-width="1"/>
  <line x1="12" y1="1" x2="818" y2="1" stroke="url(#plaser)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Header row -->
  <circle cx="24" cy="22" r="3.5" fill="#bc8cff" class="pulse-dot-p"/>
  <circle cx="24" cy="22" r="2" fill="#d2a8ff"/>
  <text x="36" y="25.5" class="label-p">ENGINEERING PHILOSOPHY &amp; SYSTEM DESIGN</text>

  <line x1="20" y1="38" x2="810" y2="38" stroke="#21262d" stroke-width="0.75"/>

  <!-- Column 1 -->
  <g transform="translate(24, 52)">
    <text x="0" y="14" class="cell-title">High Signal Architecture</text>
    <text class="cell-desc">
      <tspan x="0" y="32">Deterministic state, clean</tspan>
      <tspan x="0" y="48">abstractions &amp; low latency.</tspan>
    </text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="275" y1="46" x2="275" y2="118" stroke="#21262d" stroke-width="0.75"/>

  <!-- Column 2 -->
  <g transform="translate(295, 52)">
    <text x="0" y="14" class="cell-title">Algorithmic Rigor</text>
    <text class="cell-desc">
      <tspan x="0" y="32">Grounded in competitive</tspan>
      <tspan x="0" y="48">programming &amp; complexity.</tspan>
    </text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="550" y1="46" x2="550" y2="118" stroke="#21262d" stroke-width="0.75"/>

  <!-- Column 3 -->
  <g transform="translate(570, 52)">
    <text x="0" y="14" class="cell-title">Product Focus</text>
    <text class="cell-desc">
      <tspan x="0" y="32">Shipping end-to-end usable</tspan>
      <tspan x="0" y="48">tools with zero clutter.</tspan>
    </text>
  </g>
</svg>
