<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 116" width="830" height="116" fill="none">
  <title>Engineering Principles</title>
  <defs>
    <!-- Glassmorphic Gradients -->
    <linearGradient id="ph-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="ph-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Subtle Glass Sheen Sweep -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #8b949e; letter-spacing: 0.1px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #f0f6fc; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 400; fill: #7d8590; }
    .div-line { stroke: rgba(255, 255, 255, 0.06); stroke-width: 1px; }
  </style>

  <rect x="0.5" y="0.5" width="829" height="115" rx="8" fill="url(#ph-glass)" stroke="url(#ph-edge)"/>
  <line x1="8" y1="1" x2="822" y2="1" stroke="url(#sheen)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Header label -->
  <text x="24" y="24" class="lbl">Engineering principles &amp; design philosophy</text>
  <line x1="20" y1="36" x2="810" y2="36" class="div-line"/>

  <!-- Column 1 -->
  <g transform="translate(24, 50)">
    <text x="0" y="14" class="title">Deterministic Systems</text>
    <text class="desc">
      <tspan x="0" y="32">Explicit state, predictable data flows, low latency,</tspan>
      <tspan x="0" y="48">and minimal speculative abstractions</tspan>
    </text>
  </g>

  <line x1="285" y1="46" x2="285" y2="102" class="div-line"/>

  <!-- Column 2 -->
  <g transform="translate(305, 50)">
    <text x="0" y="14" class="title">Algorithmic Rigor</text>
    <text class="desc">
      <tspan x="0" y="32">Grounded in competitive programming, optimal</tspan>
      <tspan x="0" y="48">asymptotics, and empirical edge-case testing</tspan>
    </text>
  </g>

  <line x1="565" y1="46" x2="565" y2="102" class="div-line"/>

  <!-- Column 3 -->
  <g transform="translate(585, 50)">
    <text x="0" y="14" class="title">Product Signal</text>
    <text class="desc">
      <tspan x="0" y="32">Shipping reliable, usable end-to-end software</tspan>
      <tspan x="0" y="48">with zero artificial complexity or visual clutter</tspan>
    </text>
  </g>
</svg>