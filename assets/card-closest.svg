<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 190" width="410" height="190" fill="none">
  <title>Closest Project Card</title>
  <defs>
    <linearGradient id="closest-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a23"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="closest-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="1"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3.8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .cat-label {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.8px;
      fill: #3fb950;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
      fill: #ffffff;
    }
    .card-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      fill: #8b949e;
      line-height: 19px;
    }
    .chip-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      fill: #79c0ff;
    }
  </style>

  <!-- Card Base -->
  <rect x="0.5" y="0.5" width="409" height="189" rx="12" fill="url(#closest-bg)" stroke="#30363d"/>
  
  <!-- Top Animated Laser -->
  <path d="M 12 1 L 398 1" stroke="url(#closest-laser)" stroke-width="2" stroke-linecap="round"/>

  <!-- Category Badge -->
  <g transform="translate(24, 22)">
    <rect x="0" y="0" width="235" height="20" rx="10" fill="rgba(63, 185, 80, 0.1)" stroke="rgba(63, 185, 80, 0.3)" stroke-width="1"/>
    <text x="10" y="13.5" class="cat-label">FULL STACK · PRODUCT ENGINEERING</text>
  </g>

  <!-- Title & Description -->
  <text x="24" y="68" class="card-title">Closest</text>
  <text x="24" y="94" class="card-desc">
    <tspan x="24" dy="0">A server-rendered application built around authentication,</tspan>
    <tspan x="24" dy="19">sessions, search, filtering, pagination and persistent data.</tspan>
  </text>
  
  <!-- Tech Chips -->
  <g transform="translate(0, 146)">
    <rect x="24" y="0" width="72" height="24" rx="12" fill="rgba(56, 139, 253, 0.12)" stroke="rgba(56, 139, 253, 0.35)"/>
    <text x="60" y="16" text-anchor="middle" class="chip-text">Node.js</text>
    
    <rect x="104" y="0" width="72" height="24" rx="12" fill="rgba(56, 139, 253, 0.12)" stroke="rgba(56, 139, 253, 0.35)"/>
    <text x="140" y="16" text-anchor="middle" class="chip-text">Express</text>
    
    <rect x="184" y="0" width="50" height="24" rx="12" fill="rgba(56, 139, 253, 0.12)" stroke="rgba(56, 139, 253, 0.35)"/>
    <text x="209" y="16" text-anchor="middle" class="chip-text">EJS</text>
    
    <rect x="242" y="0" width="76" height="24" rx="12" fill="rgba(56, 139, 253, 0.12)" stroke="rgba(56, 139, 253, 0.35)"/>
    <text x="280" y="16" text-anchor="middle" class="chip-text">MongoDB</text>
  </g>
</svg>
