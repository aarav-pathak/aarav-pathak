<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 130" width="830" height="130" fill="none">
  <title>Competitive Programming Statistics</title>
  <defs>
    <linearGradient id="cp-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a23"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cf-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="lc-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffa116" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cc-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8a657" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .cp-label {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .cp-val {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .cp-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 400;
      fill: #8b949e;
    }
  </style>

  <!-- Card 1: Codeforces -->
  <g transform="translate(0, 0)">
    <rect x="0.5" y="0.5" width="261" height="129" rx="12" fill="url(#cp-card-bg)" stroke="#30363d"/>
    <path d="M 12 1 L 250 1" stroke="url(#cf-top)" stroke-width="1.5" stroke-linecap="round"/>
    
    <circle cx="20" cy="28" r="3" fill="#58a6ff"/>
    <text x="30" y="32" class="cp-label" fill="#58a6ff">CODEFORCES</text>
    <text x="20" y="74" class="cp-val">764</text>
    <text x="20" y="102" class="cp-sub">960 peak · 185 solved</text>
  </g>

  <!-- Card 2: LeetCode -->
  <g transform="translate(284, 0)">
    <rect x="0.5" y="0.5" width="261" height="129" rx="12" fill="url(#cp-card-bg)" stroke="#30363d"/>
    <path d="M 12 1 L 250 1" stroke="url(#lc-top)" stroke-width="1.5" stroke-linecap="round"/>
    
    <circle cx="20" cy="28" r="3" fill="#ffa116"/>
    <text x="30" y="32" class="cp-label" fill="#ffa116">LEETCODE</text>
    <text x="20" y="74" class="cp-val">199</text>
    <text x="20" y="102" class="cp-sub">Solved · C++, JS, Python</text>
  </g>

  <!-- Card 3: CodeChef -->
  <g transform="translate(568, 0)">
    <rect x="0.5" y="0.5" width="261" height="129" rx="12" fill="url(#cp-card-bg)" stroke="#30363d"/>
    <path d="M 12 1 L 250 1" stroke="url(#cc-top)" stroke-width="1.5" stroke-linecap="round"/>
    
    <circle cx="20" cy="28" r="3" fill="#d8a657"/>
    <text x="30" y="32" class="cp-label" fill="#d8a657">CODECHEF</text>
    <text x="20" y="74" class="cp-val">1396</text>
    <text x="20" y="102" class="cp-sub">82 solved · 22 contests</text>
  </g>
</svg>
