<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 130" width="830" height="130" fill="none">
  <title>Competitive Programming Statistics</title>
  <desc>Cards summarizing ratings and problems solved on Codeforces, LeetCode, and CodeChef</desc>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #1c2128;
      --border: #30363d;
      --border-subtle: #21262d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --accent: #58a6ff;
      --accent-soft: rgba(88, 166, 255, 0.12);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --surface: #f6f8fa;
        --surface-2: #eaeef2;
        --border: #d0d7de;
        --border-subtle: #d8dee4;
        --text: #1f2328;
        --text-muted: #656d76;
        --accent: #0969da;
        --accent-soft: rgba(9, 105, 218, 0.10);
      }
    }
  </style>

  <!-- Card 1: Codeforces -->
  <g transform="translate(0, 0)">
    <rect x="0.5" y="0.5" width="261" height="129" rx="12" fill="var(--surface)" stroke="var(--border)"/>
    <text x="24" y="32" font-family="var(--font-mono)" font-size="11" font-weight="500" letter-spacing="2" fill="var(--text-muted)">CODEFORCES</text>
    <text x="24" y="72" font-family="var(--font-sans)" font-size="32" font-weight="600" letter-spacing="-0.5" fill="var(--text)">764</text>
    <text x="24" y="100" font-family="var(--font-sans)" font-size="12" font-weight="400" fill="var(--text-muted)">960 peak · 185 solved</text>
  </g>

  <!-- Card 2: LeetCode -->
  <g transform="translate(284, 0)">
    <rect x="0.5" y="0.5" width="261" height="129" rx="12" fill="var(--surface)" stroke="var(--border)"/>
    <text x="24" y="32" font-family="var(--font-mono)" font-size="11" font-weight="500" letter-spacing="2" fill="var(--text-muted)">LEETCODE</text>
    <text x="24" y="72" font-family="var(--font-sans)" font-size="32" font-weight="600" letter-spacing="-0.5" fill="var(--text)">199</text>
    <text x="24" y="100" font-family="var(--font-sans)" font-size="12" font-weight="400" fill="var(--text-muted)">Solved · C++, JS, Python</text>
  </g>

  <!-- Card 3: CodeChef -->
  <g transform="translate(568, 0)">
    <rect x="0.5" y="0.5" width="261" height="129" rx="12" fill="var(--surface)" stroke="var(--border)"/>
    <text x="24" y="32" font-family="var(--font-mono)" font-size="11" font-weight="500" letter-spacing="2" fill="var(--text-muted)">CODECHEF</text>
    <text x="24" y="72" font-family="var(--font-sans)" font-size="32" font-weight="600" letter-spacing="-0.5" fill="var(--text)">1396</text>
    <text x="24" y="100" font-family="var(--font-sans)" font-size="12" font-weight="400" fill="var(--text-muted)">82 solved · 22 contests</text>
  </g>
</svg>
