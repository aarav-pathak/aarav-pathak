<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 135" width="830" height="135" fill="none">
  <title>Competitive Programming Statistics</title>
  <defs>
    <linearGradient id="cp-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a23"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Codeforces Laser -->
    <linearGradient id="cf-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#79c0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- LeetCode Laser -->
    <linearGradient id="lc-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffa116" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffc069" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffa116" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3.4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- CodeChef Laser -->
    <linearGradient id="cc-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8a657" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffe58f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d8a657" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3.8s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow-num" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseDotCP {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .cp-label {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .cp-val {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .cp-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 400;
      fill: #8b949e;
    }
    .cf-dot { animation: pulseDotCP 2s infinite; transform-origin: 20px 28px; }
    .lc-dot { animation: pulseDotCP 2.4s infinite; transform-origin: 20px 28px; }
    .cc-dot { animation: pulseDotCP 2.8s infinite; transform-origin: 20px 28px; }
  </style>

  <!-- Card 1: Codeforces -->
  <g transform="translate(0, 0)">
    <rect x="0.5" y="0.5" width="261" height="134" rx="12" fill="url(#cp-card-bg)" stroke="#30363d"/>
    <path d="M 12 1 L 250 1" stroke="url(#cf-laser)" stroke-width="2" stroke-linecap="round"/>
    
    <circle cx="20" cy="28" r="3" fill="#58a6ff" class="cf-dot"/>
    <text x="30" y="32" class="cp-label" fill="#58a6ff">CODEFORCES</text>
    <text x="20" y="74" class="cp-val">764</text>
    <text x="20" y="104" class="cp-sub">960 peak · 185 solved</text>
  </g>

  <!-- Card 2: LeetCode -->
  <g transform="translate(284, 0)">
    <rect x="0.5" y="0.5" width="261" height="134" rx="12" fill="url(#cp-card-bg)" stroke="#30363d"/>
    <path d="M 12 1 L 250 1" stroke="url(#lc-laser)" stroke-width="2" stroke-linecap="round"/>
    
    <circle cx="20" cy="28" r="3" fill="#ffa116" class="lc-dot"/>
    <text x="30" y="32" class="cp-label" fill="#ffa116">LEETCODE</text>
    <text x="20" y="74" class="cp-val">199</text>
    <text x="20" y="104" class="cp-sub">Solved · C++, JS, Python</text>
  </g>

  <!-- Card 3: CodeChef -->
  <g transform="translate(568, 0)">
    <rect x="0.5" y="0.5" width="261" height="134" rx="12" fill="url(#cp-card-bg)" stroke="#30363d"/>
    <path d="M 12 1 L 250 1" stroke="url(#cc-laser)" stroke-width="2" stroke-linecap="round"/>
    
    <circle cx="20" cy="28" r="3" fill="#d8a657" class="cc-dot"/>
    <text x="30" y="32" class="cp-label" fill="#d8a657">CODECHEF</text>
    <text x="20" y="74" class="cp-val">1396</text>
    <text x="20" y="104" class="cp-sub">82 solved · 22 contests</text>
  </g>
</svg>
