  <rect x="210" y="141" width="12" height="12" rx="2" fill="#58a6ff"/>
  <rect x="224" y="141" width="12" height="12" rx="2" fill="#79c0ff"/>
  <rect x="238" y="141" width="12" height="12" rx="2" fill="#388bfd"/>
