<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 200" width="830" height="200" fill="none">
  <title>GitHub Stats</title>
  <defs>
    <linearGradient id="bg-s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="laser-s" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="chip-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <style>
    .lbl{ font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size:9.5px; font-weight:600; letter-spacing:2px; fill:#58a6ff; }
    .num{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size:26px; font-weight:700; fill:#e6edf3; }
    .sub{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size:11px; fill:#7d8590; }
    .ct{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size:11px; font-weight:500; fill:#c9d1d9; }
    .dot{ font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size:8.5px; fill:#484f58; }
  </style>

  <!-- Card frame -->
  <rect x="0.5" y="0.5" width="829" height="199" rx="12" fill="url(#bg-s)" stroke="#21262d" stroke-width="1"/>
  <line x1="16" y1="1" x2="814" y2="1" stroke="url(#laser-s)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Header -->
  <circle cx="22" cy="20" r="3" fill="#3fb950"/>
  <circle cx="22" cy="20" r="1.5" fill="#56d364"/>
  <text x="32" y="24.5" class="lbl">GITHUB STATS</text>
  <line x1="140" y1="20" x2="814" y2="20" stroke="#21262d" stroke-width="0.75"/>

  <!-- Stat tiles row -->
  <rect x="16" y="42" width="122" height="58" rx="8" fill="url(#chip-g)" stroke="#21262d"/>
  <text x="28" y="62" class="sub">Contributions</text>
  <text x="28" y="90" class="num">1,318</text>

  <rect x="148" y="42" width="122" height="58" rx="8" fill="url(#chip-g)" stroke="#21262d"/>
  <text x="160" y="62" class="sub">Commits</text>
  <text x="160" y="90" class="num">1,030</text>

  <rect x="280" y="42" width="122" height="58" rx="8" fill="url(#chip-g)" stroke="#21262d"/>
  <text x="292" y="62" class="sub">Pull Requests</text>
  <text x="292" y="90" class="num">154</text>

  <rect x="412" y="42" width="122" height="58" rx="8" fill="url(#chip-g)" stroke="#21262d"/>
  <text x="424" y="62" class="sub">Repositories</text>
  <text x="424" y="90" class="num">44</text>

  <rect x="544" y="42" width="122" height="58" rx="8" fill="url(#chip-g)" stroke="#21262d"/>
  <text x="556" y="62" class="sub">Languages</text>
  <text x="556" y="90" class="num">6</text>

  <rect x="676" y="42" width="138" height="58" rx="8" fill="url(#chip-g)" stroke="#21262d"/>
  <text x="688" y="62" class="sub">Current Streak</text>
  <text x="688" y="90" class="num" fill="#f0883e">28 🔥</text>

  <!-- Contribution heatmap mini -->
  <text x="16" y="124" class="lbl" fill="#58a6ff">CONTRIBUTION CALENDAR</text>
  <line x1="16" y1="133" x2="814" y2="133" stroke="#21262d" stroke-width="0.75"/>

  <!-- Heatmap cells: 7 cols × 8 rows -->
  <!-- Row labels -->
  <text x="16" y="215" class="dot">12M</text>

  <!-- Weeks (8 weeks, 7 days each) — x starts at 56, y starts at 141 -->
  <!-- Week 1 -->
  <rect x="56" y="141" width="12" height="12" rx="2" fill="#21262d"/>
  <rect x="70" y="141" width="12" height="12" rx="2" fill="#1f6feb"/>
  <rect x="84" y="141" width="12" height="12" rx="2" fill="#1f6feb"/>
  <rect x="98" y="141" width="12" height="12" rx="2" fill="#21262d"/>
