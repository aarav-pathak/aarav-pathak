  <!-- Legend -->
  <text x="774" y="215" class="dot">Less</text>
  <rect x="742" y="207" width="12" height="12" rx="2" fill="#21262d"/>
  <rect x="758" y="207" width="12" height="12" rx="2" fill="#1f6feb"/>
  <rect x="774" y="207" width="12" height="12" rx="2" fill="#388bfd"/>
  <rect x="790" y="207" width="12" height="12" rx="2" fill="#58a6ff"/>
