  <rect x="280" y="141" width="12" height="12" rx="2" fill="#388bfd"/>
  <rect x="294" y="141" width="12" height="12" rx="2" fill="#388bfd"/>
  <rect x="308" y="141" width="12" height="12" rx="2" fill="#1f6feb"/>
  <rect x="322" y="141" width="12" height="12" rx="2" fill="#1f6feb"/>
  <rect x="336" y="141" width="12" height="12" rx="2" fill="#21262d"/>
  <!-- Week 4 -->
  <rect x="350" y="141" width="12" height="12" rx="2" fill="#21262d"/>
