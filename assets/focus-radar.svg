<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 116" width="830" height="116" fill="none">
  <title>Current Focus &amp; Roadmap</title>
  <defs>
    <!-- Glassmorphic Gradients -->
    <linearGradient id="rf-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="rf-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #8b949e; letter-spacing: 0.1px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #f0f6fc; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 400; fill: #7d8590; }
    .div-line { stroke: rgba(255, 255, 255, 0.06); stroke-width: 1px; }
    .beacon { fill: #3fb950; }
  </style>

  <!-- Glass Card Frame -->
  <rect x="0.5" y="0.5" width="829" height="115" rx="8" fill="url(#rf-glass)" stroke="url(#rf-edge)"/>
  <line x1="8" y1="1" x2="822" y2="1" stroke="url(#sheen)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Header row -->
  <circle cx="28" cy="23" r="3" class="beacon">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.6;3.2;2.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="38" y="26.5" class="lbl">Current focus &amp; active initiatives</text>
  <line x1="20" y1="36" x2="810" y2="36" class="div-line"/>

  <!-- Column 1 -->
  <g transform="translate(24, 50)">
    <text x="0" y="14" class="title">Filter Minds</text>
    <text class="desc">
      <tspan x="0" y="32">Research-first platform for high-signal discourse</tspan>
      <tspan x="0" y="48">and curated intellectual discussion · Active dev</tspan>
    </text>
  </g>

  <line x1="285" y1="46" x2="285" y2="102" class="div-line"/>

  <!-- Column 2 -->
  <g transform="translate(305, 50)">
    <text x="0" y="14" class="title">Systems &amp; Real-Time Web</text>
    <text class="desc">
      <tspan x="0" y="32">Low-latency WebSocket connections, Go services,</tspan>
      <tspan x="0" y="48">and robust backend delivery pipelines</tspan>
    </text>
  </g>

  <line x1="565" y1="46" x2="565" y2="102" class="div-line"/>

  <!-- Column 3 -->
  <g transform="translate(585, 50)">
    <text x="0" y="14" class="title">Algorithms &amp; Complexity</text>
    <text class="desc">
      <tspan x="0" y="32">Advanced graph algorithms, dynamic programming,</tspan>
      <tspan x="0" y="48">and competitive programming contest practice</tspan>
    </text>
  </g>
</svg>