<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 160" width="830" height="160" fill="none">
  <title>Currently Building &amp; Exploring</title>
  <defs>
    <linearGradient id="focus-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="flaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="focus-glow" cx="8%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#111820" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes beacon { 0%,100%{r:3.5;opacity:1} 50%{r:6;opacity:0.2} }
    .b-dot { animation: beacon 2s ease-in-out infinite; transform-origin: 28px 30px; }
    .mono-tag { font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size:10px; font-weight:700; letter-spacing:2px; fill:#58a6ff; }
    .focus-title { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size:16px; font-weight:700; fill:#e6edf3; }
    .focus-desc { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size:12.5px; font-weight:400; fill:#8b949e; line-height:1.5; }
    .focus-val { font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size:11px; font-weight:600; fill:#79c0ff; }
  </style>

  <!-- Container -->
  <rect x="0.5" y="0.5" width="829" height="159" rx="14" fill="url(#focus-bg)" stroke="#21262d" stroke-width="1"/>
  <rect width="830" height="160" rx="14" fill="url(#focus-glow)"/>
  <line x1="14" y1="1" x2="816" y2="1" stroke="url(#flaser)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Status Beacon -->
  <circle cx="28" cy="28" r="3.5" fill="#58a6ff" class="b-dot"/>
  <circle cx="28" cy="28" r="2" fill="#79c0ff"/>
  <text x="42" y="32" class="mono-tag">CURRENT RADAR &amp; INITIATIVES</text>

  <!-- Column 1: Building -->
  <g transform="translate(28, 56)">
    <rect width="236" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="0.75"/>
    <text x="14" y="24" class="focus-title">⚡ Building</text>
    <text x="14" y="44" class="focus-desc">Filter Minds platform &amp;</text>
    <text x="14" y="60" class="focus-desc">community intelligence systems</text>
    <text x="14" y="74" class="focus-val">Status: Active Development</text>
  </g>

  <!-- Column 2: Deep Diving -->
  <g transform="translate(296, 56)">
    <rect width="236" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="0.75"/>
    <text x="14" y="24" class="focus-title">🧠 Deep Diving</text>
    <text x="14" y="44" class="focus-desc">Advanced Graph Theory,</text>
    <text x="14" y="60" class="focus-desc">Dynamic Prog &amp; Distributed Systems</text>
    <text x="14" y="74" class="focus-val">Focus: Codeforces &amp; LC</text>
  </g>

  <!-- Column 3: Exploring -->
  <g transform="translate(564, 56)">
    <rect width="236" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="0.75"/>
    <text x="14" y="24" class="focus-title">🌐 Exploring</text>
    <text x="14" y="44" class="focus-desc">Real-time WebSockets, WebRTC</text>
    <text x="14" y="60" class="focus-desc">&amp; LLM Application Workflows</text>
    <text x="14" y="74" class="focus-val">Stack: Node / Next.js / AI</text>
  </g>
</svg>
