<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 175" width="830" height="175" fill="none">
  <title>Engineering Skills Overview</title>
  <defs>
    <linearGradient id="col-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a23"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="col1-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="col2-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="col3-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .col-title {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .chip-bg {
      fill: rgba(56, 139, 253, 0.09);
      stroke: rgba(56, 139, 253, 0.28);
      stroke-width: 1;
    }
    .chip-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      fill: #e6edf3;
    }
  </style>

  <!-- Column 1: Languages -->
  <g transform="translate(0, 0)">
    <rect x="0.5" y="0.5" width="261" height="174" rx="12" fill="url(#col-bg)" stroke="#30363d"/>
    <path d="M 12 1 L 250 1" stroke="url(#col1-top)" stroke-width="1.5" stroke-linecap="round"/>
    
    <circle cx="20" cy="28" r="3" fill="#58a6ff"/>
    <text x="30" y="32" class="col-title" fill="#58a6ff">LANGUAGES</text>
    
    <!-- Row 1 -->
    <rect x="18" y="52" width="46" height="24" rx="12" class="chip-bg"/>
    <text x="41" y="68" text-anchor="middle" class="chip-text">C++</text>
    
    <rect x="70" y="52" width="68" height="24" rx="12" class="chip-bg"/>
    <text x="104" y="68" text-anchor="middle" class="chip-text">Python</text>
    
    <rect x="144" y="52" width="98" height="24" rx="12" class="chip-bg"/>
    <text x="193" y="68" text-anchor="middle" class="chip-text">JavaScript</text>
    
    <!-- Row 2 -->
    <rect x="18" y="86" width="98" height="24" rx="12" class="chip-bg"/>
    <text x="67" y="102" text-anchor="middle" class="chip-text">TypeScript</text>
  </g>

  <!-- Column 2: Web & Backend -->
  <g transform="translate(284, 0)">
    <rect x="0.5" y="0.5" width="261" height="174" rx="12" fill="url(#col-bg)" stroke="#30363d"/>
    <path d="M 12 1 L 250 1" stroke="url(#col2-top)" stroke-width="1.5" stroke-linecap="round"/>
    
    <circle cx="20" cy="28" r="3" fill="#3fb950"/>
    <text x="30" y="32" class="col-title" fill="#3fb950">WEB &amp; BACKEND</text>
    
    <!-- Row 1 -->
    <rect x="18" y="52" width="74" height="24" rx="12" class="chip-bg"/>
    <text x="55" y="68" text-anchor="middle" class="chip-text">Node.js</text>
    
    <rect x="98" y="52" width="74" height="24" rx="12" class="chip-bg"/>
    <text x="135" y="68" text-anchor="middle" class="chip-text">Express</text>
    
    <!-- Row 2 -->
    <rect x="18" y="86" width="128" height="24" rx="12" class="chip-bg"/>
    <text x="82" y="102" text-anchor="middle" class="chip-text">React / Next.js</text>
    
    <!-- Row 3 -->
    <rect x="18" y="120" width="120" height="24" rx="12" class="chip-bg"/>
    <text x="78" y="136" text-anchor="middle" class="chip-text">Authentication</text>
  </g>

  <!-- Column 3: Data & Infrastructure -->
  <g transform="translate(568, 0)">
    <rect x="0.5" y="0.5" width="261" height="174" rx="12" fill="url(#col-bg)" stroke="#30363d"/>
    <path d="M 12 1 L 250 1" stroke="url(#col3-top)" stroke-width="1.5" stroke-linecap="round"/>
    
    <circle cx="20" cy="28" r="3" fill="#d29922"/>
    <text x="30" y="32" class="col-title" fill="#d29922">DATA &amp; INFRA</text>
    
    <!-- Row 1 -->
    <rect x="18" y="52" width="80" height="24" rx="12" class="chip-bg"/>
    <text x="58" y="68" text-anchor="middle" class="chip-text">MongoDB</text>
    
    <rect x="104" y="52" width="84" height="24" rx="12" class="chip-bg"/>
    <text x="146" y="68" text-anchor="middle" class="chip-text">Supabase</text>
    
    <!-- Row 2 -->
    <rect x="18" y="86" width="88" height="24" rx="12" class="chip-bg"/>
    <text x="62" y="102" text-anchor="middle" class="chip-text">REST APIs</text>
    
    <rect x="112" y="86" width="108" height="24" rx="12" class="chip-bg"/>
    <text x="166" y="102" text-anchor="middle" class="chip-text">Git / GitHub</text>
  </g>
</svg>
