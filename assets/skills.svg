<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 120" width="830" height="120" fill="none">
  <title>Engineering Skills</title>
  <defs>
    <!-- Glassmorphic Gradients -->
    <linearGradient id="sk-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="sk-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="chip-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f242c" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#12161c" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="chip-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Subtle Glass Sheen Sweep -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #8b949e; letter-spacing: 0.1px; }
    .chip-txt { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; fill: #c9d1d9; }
    .div-line { stroke: rgba(255, 255, 255, 0.06); stroke-width: 1px; }
  </style>

  <rect x="0.5" y="0.5" width="829" height="119" rx="8" fill="url(#sk-glass)" stroke="url(#sk-edge)"/>
  <line x1="8" y1="1" x2="822" y2="1" stroke="url(#sheen)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Col 1: Languages -->
  <g transform="translate(24, 20)">
    <text x="0" y="0" class="col-title">Languages</text>
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="34" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="17" y="14" text-anchor="middle" class="chip-txt">Go</text>

      <rect x="40" y="0" width="76" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="78" y="14" text-anchor="middle" class="chip-txt">TypeScript</text>

      <rect x="122" y="0" width="76" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="160" y="14" text-anchor="middle" class="chip-txt">JavaScript</text>
    </g>
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="40" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="20" y="14" text-anchor="middle" class="chip-txt">C++</text>

      <rect x="46" y="0" width="56" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="74" y="14" text-anchor="middle" class="chip-txt">Python</text>
    </g>
  </g>

  <line x1="285" y1="20" x2="285" y2="100" class="div-line"/>

  <!-- Col 2: Web & Systems -->
  <g transform="translate(305, 20)">
    <text x="0" y="0" class="col-title">Web &amp; backend systems</text>
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="58" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="29" y="14" text-anchor="middle" class="chip-txt">Node.js</text>

      <rect x="64" y="0" width="58" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="93" y="14" text-anchor="middle" class="chip-txt">Express</text>

      <rect x="128" y="0" width="82" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="169" y="14" text-anchor="middle" class="chip-txt">WebSockets</text>
    </g>
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="50" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="25" y="14" text-anchor="middle" class="chip-txt">React</text>

      <rect x="56" y="0" width="58" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="85" y="14" text-anchor="middle" class="chip-txt">Next.js</text>

      <rect x="120" y="0" width="60" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="150" y="14" text-anchor="middle" class="chip-txt">Tailwind</text>
    </g>
  </g>

  <line x1="565" y1="20" x2="565" y2="100" class="div-line"/>

  <!-- Col 3: Data & Infra -->
  <g transform="translate(585, 20)">
    <text x="0" y="0" class="col-title">Data &amp; developer tools</text>
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="76" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="38" y="14" text-anchor="middle" class="chip-txt">PostgreSQL</text>

      <rect x="82" y="0" width="68" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="116" y="14" text-anchor="middle" class="chip-txt">MongoDB</text>

      <rect x="156" y="0" width="68" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="190" y="14" text-anchor="middle" class="chip-txt">Supabase</text>
    </g>
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="38" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="19" y="14" text-anchor="middle" class="chip-txt">Git</text>

      <rect x="44" y="0" width="94" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="91" y="14" text-anchor="middle" class="chip-txt">GitHub Actions</text>

      <rect x="144" y="0" width="46" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="167" y="14" text-anchor="middle" class="chip-txt">Linux</text>
    </g>
  </g>
</svg>