<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 152" width="410" height="152" fill="none">
  <title>Sheeter</title>
  <defs>
    <linearGradient id="cg-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="cg-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="chip-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f242c" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#12161c" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="chip-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="7.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .cat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #8b949e; letter-spacing: 0.1px; }
    .live { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; fill: #3fb950; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #f0f6fc; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #7d8590; }
    .chip-txt { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; fill: #c9d1d9; }
    .beacon { fill: #3fb950; }
  </style>

  <rect x="0.5" y="0.5" width="409" height="151" rx="8" fill="url(#cg-glass)" stroke="url(#cg-edge)"/>
  <line x1="6" y1="1" x2="404" y2="1" stroke="url(#sheen)" stroke-width="1.2" stroke-linecap="round"/>

  <g transform="translate(20, 20)">
    <text x="0" y="10" class="cat">Spreadsheet engine</text>

    <g transform="translate(322, 0)">
      <circle cx="0" cy="7" r="2.5" class="beacon">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="r" values="2.2;2.8;2.2" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="8" y="10" class="live">Live ↗</text>
    </g>

    <text x="0" y="42" class="title">Sheeter</text>

    <text class="desc">
      <tspan x="0" y="65">Browser spreadsheet engine supporting formula evaluation,</tspan>
      <tspan x="0" y="83">cell dependencies, and client-side computational grid.</tspan>
    </text>

    <g transform="translate(0, 98)">
      <rect x="0" y="0" width="50" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="25" y="14" text-anchor="middle" class="chip-txt">React</text>

      <rect x="56" y="0" width="58" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="85" y="14" text-anchor="middle" class="chip-txt">Next.js</text>

      <rect x="120" y="0" width="76" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="158" y="14" text-anchor="middle" class="chip-txt">JavaScript</text>

      <rect x="202" y="0" width="60" height="20" rx="4" fill="url(#chip-glass)" stroke="url(#chip-edge)"/>
      <text x="232" y="14" text-anchor="middle" class="chip-txt">Tailwind</text>
    </g>
  </g>
</svg>