<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 185" width="410" height="185" fill="none">
  <title>Sheeter - Web Spreadsheet Tool</title>
  <defs>
    <linearGradient id="sh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131922"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="sh-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7ee787" stop-opacity="1"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3.8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .cat-label {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.8px;
      fill: #3fb950;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
      fill: #ffffff;
    }
    .card-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      fill: #8b949e;
      line-height: 19px;
    }
    .chip-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      fill: #79c0ff;
    }
  </style>

  <!-- Card Base -->
  <rect x="0.5" y="0.5" width="409" height="184" rx="12" fill="url(#sh-bg)" stroke="#30363d"/>
  <path d="M 12 1 L 398 1" stroke="url(#sh-laser)" stroke-width="2" stroke-linecap="round"/>

  <!-- Category Badge -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="180" height="20" rx="10" fill="rgba(63, 185, 80, 0.1)" stroke="rgba(63, 185, 80, 0.3)" stroke-width="1"/>
    <text x="10" y="13.5" class="cat-label">PRODUCTIVITY · DATA</text>
  </g>

  <!-- Title & Description -->
  <text x="24" y="66" class="card-title">Sheeter</text>
  <text x="24" y="92" class="card-desc">
    <tspan x="24" dy="0">Fast web-based spreadsheet utility for fast calculation,</tspan>
    <tspan x="24" dy="19">structured formula evaluation and table manipulation.</tspan>
  </text>
  
  <!-- Tech Chips -->
  <g transform="translate(0, 142)">
    <rect x="24" y="0" width="60" height="24" rx="12" fill="rgba(56, 139, 253, 0.12)" stroke="rgba(56, 139, 253, 0.35)"/>
    <text x="54" y="16" text-anchor="middle" class="chip-text">React</text>
    
    <rect x="92" y="0" width="70" height="24" rx="12" fill="rgba(56, 139, 253, 0.12)" stroke="rgba(56, 139, 253, 0.35)"/>
    <text x="127" y="16" text-anchor="middle" class="chip-text">Next.js</text>
    
    <rect x="170" y="0" width="90" height="24" rx="12" fill="rgba(56, 139, 253, 0.12)" stroke="rgba(56, 139, 253, 0.35)"/>
    <text x="215" y="16" text-anchor="middle" class="chip-text">JavaScript</text>
  </g>
</svg>
