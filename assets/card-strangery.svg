<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 152" width="410" height="152" fill="none">
  <title>Strangery</title>
  <style>
    .frame { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
    .cat { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #8b949e; }
    .live { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; fill: #3fb950; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #f0f6fc; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #8b949e; }
    .chip-bg { fill: #161b22; stroke: #21262d; stroke-width: 1px; rx: 4px; }
    .chip-txt { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; fill: #c9d1d9; }
  </style>

  <rect x="0.5" y="0.5" width="409" height="151" class="frame"/>

  <g transform="translate(20, 20)">
    <text x="0" y="10" class="cat">Real-time systems</text>
    <text x="370" y="10" text-anchor="end" class="live">Live ↗</text>

    <text x="0" y="42" class="title">Strangery</text>

    <text class="desc">
      <tspan x="0" y="65">Anonymous real-time chat with instant matchmaking</tspan>
      <tspan x="0" y="83">and low-latency WebSocket peer connections.</tspan>
    </text>

    <g transform="translate(0, 98)">
      <rect x="0" y="0" width="82" height="20" class="chip-bg"/>
      <text x="41" y="14" text-anchor="middle" class="chip-txt">WebSockets</text>

      <rect x="88" y="0" width="58" height="20" class="chip-bg"/>
      <text x="117" y="14" text-anchor="middle" class="chip-txt">Node.js</text>

      <rect x="152" y="0" width="58" height="20" class="chip-bg"/>
      <text x="181" y="14" text-anchor="middle" class="chip-txt">Express</text>

      <rect x="216" y="0" width="60" height="20" class="chip-bg"/>
      <text x="246" y="14" text-anchor="middle" class="chip-txt">Tailwind</text>
    </g>
  </g>
</svg>