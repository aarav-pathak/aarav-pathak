<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 260" width="830" height="260" fill="none">
  <title>Aarav Pathak</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e16"/>
    </linearGradient>

    <!-- subtle right-side glow -->
    <radialGradient id="glow" cx="85%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.18;0.08;0.18" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- top border shine -->
    <linearGradient id="top-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="20%" stop-color="#58a6ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#79c0ff" stop-opacity="1"/>
      <stop offset="80%" stop-color="#58a6ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- name gradient -->
    <linearGradient id="name-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="55%" stop-color="#cdd9e5"/>
      <stop offset="100%" stop-color="#79c0ff"/>
      <animate attributeName="x2" values="100%;140%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- dot pattern -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#21262d"/>
    </pattern>
    <linearGradient id="dots-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dm">
      <rect width="830" height="260" rx="14" fill="url(#dots-fade)"/>
    </mask>

    <!-- shimmer for accent bar -->
    <linearGradient id="accent-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
      <animate attributeName="x1" values="-100%;100%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- typewriter clip 1 -->
    <clipPath id="tw1">
      <rect x="40" y="126" height="28" width="0">
        <animate attributeName="width" values="0;600;600;0;0" keyTimes="0;0.38;0.48;0.50;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- typewriter clip 2 -->
    <clipPath id="tw2">
      <rect x="40" y="126" height="28" width="0">
        <animate attributeName="width" values="0;0;560;560;0" keyTimes="0;0.52;0.88;0.97;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <filter id="fg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes floatA {
      0%,100%{ transform:translateY(0) scale(1); opacity:.5; }
      50%{ transform:translateY(-10px) scale(1.15); opacity:.9; }
    }
    @keyframes floatB {
      0%,100%{ transform:translateY(0) scale(1); opacity:.35; }
      50%{ transform:translateY(8px) scale(0.9); opacity:.7; }
    }
    @keyframes pulseDot {
      0%,100%{ r:3.5; opacity:1; }
      50%{ r:5.5; opacity:0; }
    }
    .fa{ animation:floatA 5s ease-in-out infinite; transform-origin:760px 55px; }
    .fb{ animation:floatB 4.2s ease-in-out infinite 1s; transform-origin:680px 200px; }
    .blink{ animation:blink 0.85s step-end infinite; }
    .badge-text{
      font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
      font-size:10.5px; font-weight:500; letter-spacing:2.5px; fill:#7d8590;
    }
    .name{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      font-size:40px; font-weight:700; letter-spacing:-1px; fill:url(#name-g);
    }
    .typing{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      font-size:15px; font-weight:500; fill:#58a6ff; letter-spacing:0.1px;
    }
    .typing2{ fill:#79c0ff; }
    .bio{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      font-size:13px; font-weight:400; fill:#7d8590; line-height:1.6;
    }
  </style>

  <!-- base -->
  <rect width="830" height="260" rx="14" fill="url(#bg)"/>
  <!-- dot grid -->
  <rect width="830" height="260" rx="14" fill="url(#dots)" mask="url(#dm)" opacity="0.9"/>
  <!-- ambient glow -->
  <rect width="830" height="260" rx="14" fill="url(#glow)"/>
  <!-- outer stroke -->
  <rect x="0.5" y="0.5" width="829" height="259" rx="13.5" fill="none" stroke="#21262d"/>
  <!-- animated top-border shine -->
  <line x1="14" y1="1" x2="816" y2="1" stroke="url(#top-line)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- floating particles -->
  <circle cx="760" cy="55" r="3" fill="#388bfd" class="fa" filter="url(#fg)"/>
  <circle cx="800" cy="110" r="1.8" fill="#79c0ff" opacity="0.5"/>
  <circle cx="680" cy="200" r="2.5" fill="#a371f7" class="fb" filter="url(#fg)"/>
  <circle cx="740" cy="180" r="1.4" fill="#3fb950" opacity="0.45"/>

  <!-- beacon badge -->
  <rect x="40" y="30" width="215" height="23" rx="11.5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="52" cy="41.5" r="3.5" fill="#3fb950" filter="url(#fg)">
    <animate attributeName="r" values="3.5;5.5;3.5" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="41.5" r="2" fill="#56d364"/>
  <text x="63" y="45.5" class="badge-text">FOUNDER · FILTER MINDS</text>

  <!-- name -->
  <text x="40" y="107" class="name">Aarav Pathak</text>

  <!-- typewriter line 1 -->
  <g clip-path="url(#tw1)">
    <text x="40" y="148" class="typing">Software Developer · Product Builder · Competitive Programmer</text>
  </g>

  <!-- typewriter line 2 -->
  <g clip-path="url(#tw2)">
    <text x="40" y="148" class="typing typing2">Full-Stack Engineer · AI Systems · Competitive Programming</text>
  </g>

  <!-- blinking cursor -->
  <line stroke="#58a6ff" stroke-width="2" stroke-linecap="round" class="blink">
    <animate attributeName="x1" values="40;600;600;40;40;555;555;40;40" keyTimes="0;0.38;0.48;0.50;0.52;0.88;0.97;1;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="40;600;600;40;40;555;555;40;40" keyTimes="0;0.38;0.48;0.50;0.52;0.88;0.97;1;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="134;134;134;134;134;134;134;134;134" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="150;150;150;150;150;150;150;150;150" dur="10s" repeatCount="indefinite"/>
  </line>

  <!-- bio -->
  <text x="40" y="185" class="bio">
    <tspan x="40">I build products, web systems and side projects across full-stack engineering,</tspan>
    <tspan x="40" dy="19">AI integration and competitive programming.</tspan>
  </text>

  <!-- accent bar -->
  <rect x="40" y="228" width="52" height="2.5" rx="1.25" fill="url(#accent-g)"/>
  <rect x="100" y="228" width="10" height="2.5" rx="1.25" fill="#21262d"/>
  <rect x="114" y="228" width="5" height="2.5" rx="1.25" fill="#161b22"/>
</svg>
