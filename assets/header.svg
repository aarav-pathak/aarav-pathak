<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 260" width="830" height="260" fill="none">
  <title>Aarav Pathak - Profile Header</title>
  <desc>Header banner with name, title, and concise introduction</desc>
  <defs>
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="var(--border-subtle)" opacity="0.6"/>
    </pattern>
    <linearGradient id="fade-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="grid-mask">
      <rect x="0" y="0" width="830" height="260" rx="12" fill="url(#fade-grad)"/>
    </mask>
  </defs>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #1c2128;
      --border: #30363d;
      --border-subtle: #21262d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --accent: #58a6ff;
      --accent-soft: rgba(88, 166, 255, 0.12);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --surface: #f6f8fa;
        --surface-2: #eaeef2;
        --border: #d0d7de;
        --border-subtle: #d8dee4;
        --text: #1f2328;
        --text-muted: #656d76;
        --accent: #0969da;
        --accent-soft: rgba(9, 105, 218, 0.10);
      }
    }
    @media (prefers-reduced-motion: no-preference) {
      .header-container {
        animation: fadeIn 0.6s ease-out forwards;
      }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
  <g class="header-container">
    <rect x="0.5" y="0.5" width="829" height="259" rx="12" fill="var(--bg)" stroke="var(--border-subtle)"/>
    <rect x="0" y="0" width="830" height="260" rx="12" fill="url(#dot-grid)" mask="url(#grid-mask)"/>
    
    <text x="40" y="56" font-family="var(--font-mono)" font-size="11" font-weight="500" letter-spacing="2.4" fill="var(--text-muted)">FOUNDER · FILTER MINDS</text>
    <text x="40" y="112" font-family="var(--font-sans)" font-size="44" font-weight="600" letter-spacing="-1.2" fill="var(--text)">Aarav Pathak</text>
    <text x="40" y="148" font-family="var(--font-sans)" font-size="16" font-weight="400" fill="var(--text-muted)">Software Developer · Product Builder · Competitive Programmer</text>
    <text x="40" y="180" font-family="var(--font-sans)" font-size="14" font-weight="400" fill="var(--text-muted)">
      <tspan x="40" dy="0">I build products, web systems and technical experiments across</tspan>
      <tspan x="40" dy="20">full-stack engineering, AI and problem solving.</tspan>
    </text>
    <rect x="40" y="220" width="48" height="2" rx="1" fill="var(--accent)"/>
  </g>
</svg>
