<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 144" width="830" height="144" fill="none">
  <title>Aarav Pathak</title>
  <defs>
    <!-- Glassmorphic Gradients -->
    <linearGradient id="header-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="tag-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f242c" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#12161c" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="tag-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Subtle Glass Sheen Sweep -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.5px; fill: #f0f6fc; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #8b949e; }
    .bio { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 400; fill: #8b949e; }
    .tag-txt { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 400; fill: #c9d1d9; }
    .status-dot { fill: #3fb950; }
  </style>

  <!-- Base Glass Frame -->
  <rect x="0.5" y="0.5" width="829" height="143" rx="8" fill="url(#header-glass)" stroke="url(#glass-edge)"/>
  <line x1="8" y1="1" x2="822" y2="1" stroke="url(#sheen)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Content Group -->
  <g transform="translate(32, 28)">
    <text x="0" y="4" class="name">Aarav Pathak</text>
    <text x="0" y="26" class="title">Software Engineer · Full-Stack &amp; Systems</text>

    <!-- Bio Description -->
    <text class="bio">
      <tspan x="0" y="50">Building high-signal web applications, real-time architectures, and developer tools.</tspan>
      <tspan x="0" y="68">Active in open-source development and competitive programming.</tspan>
    </text>

    <!-- Glass Metadata Badges -->
    <g transform="translate(0, 84)">
      <!-- Location -->
      <rect x="0" y="0" width="124" height="20" rx="4" fill="url(#tag-glass)" stroke="url(#tag-edge)"/>
      <text x="10" y="14" class="tag-txt">Delhi NCR, India</text>

      <!-- Founder Role -->
      <rect x="132" y="0" width="168" height="20" rx="4" fill="url(#tag-glass)" stroke="url(#tag-edge)"/>
      <text x="142" y="14" class="tag-txt">Founder, Filter Minds</text>

      <!-- Primary Stack Focus with Subtle Live Beacon -->
      <rect x="308" y="0" width="292" height="20" rx="4" fill="url(#tag-glass)" stroke="url(#tag-edge)"/>
      <circle cx="320" cy="10" r="3" class="status-dot">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="2.6;3.2;2.6" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <text x="330" y="14" class="tag-txt">Focus: Go · TypeScript · Distributed Systems</text>
    </g>
  </g>
</svg>