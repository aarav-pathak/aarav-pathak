<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 144" width="830" height="144" fill="none">
  <title>Aarav Pathak</title>
  <style>
    .frame { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
    .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.5px; fill: #f0f6fc; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #8b949e; }
    .bio { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 400; fill: #8b949e; }
    .tag-bg { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 4px; }
    .tag-txt { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 400; fill: #c9d1d9; }
    .status-dot { fill: #3fb950; }
  </style>

  <!-- Base Frame -->
  <rect x="0.5" y="0.5" width="829" height="143" class="frame"/>

  <!-- Content Group -->
  <g transform="translate(32, 28)">
    <!-- Name and Status -->
    <text x="0" y="4" class="name">Aarav Pathak</text>
    <text x="0" y="26" class="title">Software Engineer · Full-Stack &amp; Systems</text>

    <!-- Bio Description -->
    <text class="bio">
      <tspan x="0" y="50">Building high-signal web applications, real-time architectures, and developer tools.</tspan>
      <tspan x="0" y="68">Active in open-source development and competitive programming.</tspan>
    </text>

    <!-- Metadata Badges -->
    <g transform="translate(0, 84)">
      <!-- Location -->
      <rect x="0" y="0" width="124" height="20" class="tag-bg"/>
      <text x="10" y="14" class="tag-txt">Delhi NCR, India</text>

      <!-- Founder Role -->
      <rect x="132" y="0" width="168" height="20" class="tag-bg"/>
      <text x="142" y="14" class="tag-txt">Founder, Filter Minds</text>

      <!-- Primary Stack Focus -->
      <rect x="308" y="0" width="292" height="20" class="tag-bg"/>
      <circle cx="320" cy="10" r="3" class="status-dot"/>
      <text x="330" y="14" class="tag-txt">Focus: Go · TypeScript · Distributed Systems</text>
    </g>
  </g>
</svg>
