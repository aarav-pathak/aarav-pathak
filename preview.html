<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aarav Pathak — Glassmorphic Profile Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #07090e;
      background-image: 
        radial-gradient(circle at 18% 12%, rgba(56, 139, 253, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 82% 45%, rgba(63, 185, 80, 0.05) 0%, transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(139, 148, 158, 0.05) 0%, transparent 50%);
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      padding: 48px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .glass-container {
      width: 100%;
      max-width: 900px;
      background: rgba(13, 17, 23, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 12px;
      box-shadow: 
        0 24px 64px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      padding: 36px 32px;
    }
    .profile-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .glass-card {
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), filter 0.25s ease;
      display: block;
      border-radius: 8px;
    }
    .glass-card:hover {
      transform: translateY(-2.5px);
      filter: brightness(1.05);
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 4px 0;
    }
    td {
      padding: 6px;
      vertical-align: top;
    }
    .badges-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }
    .badges-row a {
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
      display: inline-block;
    }
    .badges-row a:hover {
      transform: translateY(-2px);
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="glass-container">
    <div class="profile-wrap">
      <!-- Header -->
      <div class="glass-card">
        <img src="assets/header.svg" alt="Aarav Pathak" width="830"/>
      </div>

      <!-- Current Focus -->
      <img src="assets/section-initiatives.svg" alt="Current Focus" width="830"/>
      <div class="glass-card">
        <img src="assets/focus-radar.svg" alt="Current Focus & Initiatives" width="830"/>
      </div>

      <!-- Selected Work -->
      <img src="assets/section-selected-work.svg" alt="Selected Work" width="830"/>

      <table width="100%" cellspacing="0" cellpadding="0" border="0">
        <tr>
          <td width="50%" align="left">
            <a href="https://filterminds.com" target="_blank" rel="noreferrer" class="glass-card">
              <img src="assets/card-filter-minds.svg" alt="Filter Minds" width="410"/>
            </a>
          </td>
          <td width="50%" align="right">
            <a href="https://kaizen-mirai.vercel.app/" target="_blank" rel="noreferrer" class="glass-card">
              <img src="assets/card-kaizen-mirai.svg" alt="Kaizen Mirai" width="410"/>
            </a>
          </td>
        </tr>
        <tr>
          <td width="50%" align="left">
            <a href="https://strangery.vercel.app/" target="_blank" rel="noreferrer" class="glass-card">
              <img src="assets/card-strangery.svg" alt="Strangery" width="410"/>
            </a>
          </td>
          <td width="50%" align="right">
            <a href="https://closest.onrender.com" target="_blank" rel="noreferrer" class="glass-card">
              <img src="assets/card-closest.svg" alt="Closest" width="410"/>
            </a>
          </td>
        </tr>
        <tr>
          <td width="50%" align="left">
            <a href="https://sheeter-nine.vercel.app/" target="_blank" rel="noreferrer" class="glass-card">
              <img src="assets/card-sheeter.svg" alt="Sheeter" width="410"/>
            </a>
          </td>
          <td width="50%" align="right">
            <a href="https://tasky-seven-delta.vercel.app/auth" target="_blank" rel="noreferrer" class="glass-card">
              <img src="assets/card-tasky.svg" alt="Tasky" width="410"/>
            </a>
          </td>
        </tr>
      </table>

      <!-- Engineering & Principles -->
      <img src="assets/section-engineering.svg" alt="Engineering" width="830"/>
      <div class="glass-card">
        <img src="assets/skills.svg" alt="Skills" width="830"/>
      </div>
      <div class="glass-card">
        <img src="assets/philosophy.svg" alt="Engineering Principles" width="830"/>
      </div>

      <!-- GitHub Activity -->
      <img src="assets/section-github.svg" alt="GitHub Activity" width="830"/>
      <a href="https://github.com/aarav-pathak" target="_blank" rel="noreferrer" class="glass-card">
        <img src="assets/stats.svg" alt="GitHub Activity Overview" width="830"/>
      </a>

      <!-- Competitive Programming -->
      <img src="assets/section-competitive.svg" alt="Competitive Programming" width="830"/>
      <a href="https://codechef.com/users/alive_frog_99" target="_blank" rel="noreferrer" class="glass-card">
        <img src="assets/competitive.svg" alt="Competitive Programming Stats" width="830"/>
      </a>

      <!-- Connect -->
      <img src="assets/section-elsewhere.svg" alt="Connect" width="830"/>
      <div class="badges-row">
        <a href="https://linkedin.com/in/aaravpathak" target="_blank" rel="noreferrer">
          <img src="https://img.shields.io/badge/LinkedIn-0d1117?style=flat-square&logo=linkedin&logoColor=f0f6fc" alt="LinkedIn"/>
        </a>
        <a href="https://github.com/aarav-pathak" target="_blank" rel="noreferrer">
          <img src="https://img.shields.io/badge/GitHub-0d1117?style=flat-square&logo=github&logoColor=f0f6fc" alt="GitHub"/>
        </a>
        <a href="https://leetcode.com/u/orthodoxcoder/" target="_blank" rel="noreferrer">
          <img src="https://img.shields.io/badge/LeetCode-0d1117?style=flat-square&logo=leetcode&logoColor=f0f6fc" alt="LeetCode"/>
        </a>
        <a href="https://codeforces.com/profile/orthodoxcoder" target="_blank" rel="noreferrer">
          <img src="https://img.shields.io/badge/Codeforces-0d1117?style=flat-square&logo=codeforces&logoColor=f0f6fc" alt="Codeforces"/>
        </a>
        <a href="https://codechef.com/users/alive_frog_99" target="_blank" rel="noreferrer">

        <a href="https://filterminds.com" target="_blank" rel="noreferrer">

        </a>
      </div>
    </div>
  </div>
</body>
</html>
